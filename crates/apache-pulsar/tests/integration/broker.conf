# Appended to the image's conf/standalone.conf (Java properties: the last
# occurrence of a key wins). The files under /it are generated by the test
# harness (env.rs) and copied into the container.

# Two listeners (PIP-95). "internal" is the default and is what the proxy and
# in-network clients see. "external" is bound on its own ports, published to the
# host on the same port numbers, and is chosen automatically for connections that
# arrive on those ports, so host-side lookups answer localhost:26650/26651.
brokerServicePort=6650
brokerServicePortTls=6651
webServicePort=8080
bindAddresses=external:pulsar://0.0.0.0:26650,external:pulsar+ssl://0.0.0.0:26651
advertisedListeners=internal:pulsar://apr-it-broker:6650,internal:pulsar+ssl://apr-it-broker:6651,external:pulsar://localhost:26650,external:pulsar+ssl://localhost:26651
internalListenerName=internal

# TLS. Client certificates are optional on connect (token clients use TLS too)
# but are validated against the CA when presented.
tlsCertificateFilePath=/it/broker.cert.pem
tlsKeyFilePath=/it/broker.key.pem
tlsTrustCertsFilePath=/it/ca.cert.pem
tlsAllowInsecureConnection=false
tlsRequireTrustedClientCertOnConnect=false

# Authentication: JWT tokens (HS256 secret) and TLS client certificates (role = CN).
authenticationEnabled=true
authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken,org.apache.pulsar.broker.authentication.AuthenticationProviderTls
tokenSecretKey=file:///it/secret.key

# Authorization is off: every authenticated role can use public/default.
authorizationEnabled=false
superUserRoles=apr-it-admin,apr-it-proxy

# The proxy authenticates as apr-it-proxy and passes the client's principal.
# It cannot forward a client certificate, so the broker trusts the principal the
# proxy authenticated instead of re-checking the original credentials.
proxyRoles=apr-it-proxy
authenticateOriginalAuthData=false

# Internal clients of the standalone (namespace bootstrap, system topics).
brokerClientAuthenticationPlugin=org.apache.pulsar.client.impl.auth.AuthenticationToken
brokerClientAuthenticationParameters=file:///it/admin.token

# Off: services the tests don't use. Functions and stream storage are off on the
# command line, and package management is off by default.
webSocketServiceEnabled=false
