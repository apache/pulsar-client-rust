# Appended to the image's conf/proxy.conf (the last occurrence of a key wins).
# The files under /it are generated by the test harness (env.rs).

clusterName=standalone

# Static discovery: talk to the broker's internal listener over plaintext.
brokerServiceURL=pulsar://apr-it-broker:6650
brokerWebServiceURL=http://apr-it-broker:8080
tlsEnabledWithBroker=false

servicePort=6650
servicePortTls=6651
webServicePort=8080

tlsCertificateFilePath=/it/proxy.cert.pem
tlsKeyFilePath=/it/proxy.key.pem
tlsTrustCertsFilePath=/it/ca.cert.pem
tlsAllowInsecureConnection=false
tlsRequireTrustedClientCertOnConnect=false

authenticationEnabled=true
authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken,org.apache.pulsar.broker.authentication.AuthenticationProviderTls
tokenSecretKey=file:///it/secret.key
authorizationEnabled=false
superUserRoles=apr-it-admin
forwardAuthorizationCredentials=true

# The proxy's own identity towards the broker (listed in the broker's proxyRoles).
brokerClientAuthenticationPlugin=org.apache.pulsar.client.impl.auth.AuthenticationToken
brokerClientAuthenticationParameters=file:///it/proxy.token
