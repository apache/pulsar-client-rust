[package]
name = "apache-pulsar-protocol"
description = "Internal sans-IO protocol core of the apache-pulsar crate. Not a stable API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
buffa.workspace = true
bytes.workspace = true
crc32c.workspace = true
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"], optional = true }
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-decode", "safe-encode"], optional = true }
snap = { version = "1.1.2", optional = true }
thiserror.workspace = true
zstd = { version = "0.14.4", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Micro-benchmarks of the producer's and the consumer's work on entries (docs/8-quality.md §6): `cargo bench`.
[[bench]]
name = "entries"
harness = false

# The codecs that consumers decode and producers encode: each behind a feature, all on by default
# (docs/3-protocol.md §6). The workspace takes this crate without them: apache-pulsar forwards each.
[features]
default = ["lz4", "zlib", "snappy", "zstd"]
lz4 = ["dep:lz4_flex"]
zlib = ["dep:flate2"]
snappy = ["dep:snap"]
zstd = ["dep:zstd"]
