github:
  description: "Apache Pulsar Rust client library"
  homepage: https://pulsar.apache.org/
  labels:
    - pulsar
    - pubsub
    - messaging
    - streaming
    - queuing
    - event-streaming
    - rust
  features:
    # Enable wiki for documentation
    wiki: false
    # Enable issues management
    issues: true
    # Enable projects for project management boards
    projects: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  pull_requests:
    # Show the "Update branch" button on pull requests that are behind the base branch.
    allow_update_branch: true
    # Delete the head branch after a pull request is merged.
    del_branch_on_merge: true
  protected_branches:
    main:
      # squash or rebase must be allowed in the repo for this setting to be set to true.
      required_linear_history: true
      required_signatures: false
      # Requires all conversations on code to be resolved before a pull request can be merged.
      required_conversation_resolution: true

notifications:
  commits: commits@pulsar.apache.org
  issues: commits@pulsar.apache.org
  pullrequests: commits@pulsar.apache.org
  discussions: dev@pulsar.apache.org
  jira_options: link label
