# cargo-deny: dependency licenses, advisories and sources.
# Licenses: ASF Category A only (https://www.apache.org/legal/resolved.html#category-a).

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, no replacement yet; testcontainers (a dev-dependency, the integration tests) needs it.
    { id = "RUSTSEC-2026-0440", reason = "dev-only, through testcontainers 0.28; revisit when it moves off" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
