[workspace]
resolver = "3"
members = [
    "crates/apache-pulsar",
    "crates/apache-pulsar-protocol",
    "crates/apache-pulsar-testkit",
    "checks/compio-checks",
    "checks/first-contact",
    "xtask",
]
default-members = [
    "crates/apache-pulsar",
    "crates/apache-pulsar-protocol",
    "crates/apache-pulsar-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/apache/pulsar-client-rust"
homepage = "https://pulsar.apache.org"

[workspace.dependencies]
apache-pulsar-protocol = { path = "crates/apache-pulsar-protocol", version = "=0.1.0" }
# buffa is pinned exactly: the generated code in apache-pulsar-protocol is committed and must match the runtime.
buffa = "=0.9.2"
buffa-build = "=0.9.2"
bytes = "1.12"
compio = "0.19.2"
crc32c = "0.6"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
